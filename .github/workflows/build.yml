name: Build The Lounge APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TheLounge.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: TheLounge-apk
          path: TheLounge.apk

      - name: Publish to the "latest" release (fixed download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: The Lounge (latest build)
          files: TheLounge.apk
